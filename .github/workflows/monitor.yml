name: Monitoreo de precios

on:
  schedule:
    # Respaldo: cron en UTC. Ventana: vie 27-nov 00:00 a lun 30-nov 23:59 (Chile).
    - cron: "7,37 * 27-30 11 *"
    - cron: "7,37 0-2 1 12 *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal = respeta la ventana | forzar = ignora la ventana | test = correo de prueba (no usar)"
        type: choice
        options:
          - normal
          - forzar
          - test
        default: normal

permissions:
  contents: write
  actions: write

concurrency:
  group: monitoreo-precios
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Monitorear cada 30 minutos (unas 5 horas)
        env:
          REMITENTE: ${{ secrets.REMITENTE }}
          DESTINATARIO: ${{ secrets.DESTINATARIO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MODO: ${{ github.event.inputs.modo || 'normal' }}
        run: |
          FIN=$(date -u -d "2026-12-01 03:00:00" +%s)
          git config user.name "monitoreo-precios"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 10); do
            echo "=== Revision $i - $(date -u) ==="
            if [ "$i" = "1" ]; then M="$MODO"; else M="normal"; fi
            case "$M" in
              forzar) python3 monitor.py --forzar || true ;;
              test) python3 monitor.py --test || true ;;
              *) python3 monitor.py || true ;;
            esac
            if [ -f estado.json ]; then
              git add estado.json
              if ! git diff --cached --quiet; then
                git commit -q -m "Actualizar estado"
                git pull --rebase -q origin main || true
                git push -q || true
              fi
            fi
            [ "$MODO" = "test" ] && break
            [ "$(date -u +%s)" -ge "$FIN" ] && break
            [ "$i" -lt 10 ] && sleep 1800
          done

      - name: Lanzar la siguiente ejecucion
        if: ${{ github.event.inputs.modo != 'test' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FIN=$(date -u -d "2026-12-01 03:00:00" +%s)
          if [ "$(date -u +%s)" -lt "$FIN" ]; then
            gh workflow run monitor.yml --ref main -f modo=normal
          fi
